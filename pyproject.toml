[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quadmesh"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "gmsh",
    "trimesh",
    "networkx",
]

[project.scripts]
quadmesh-partition-2d = "domain_partition.cli:main"

[tool.pytest.ini_options]
addopts = "--ignore=domain_partition/test_v2.py"

[tool.setuptools.packages.find]
where = ["."]
